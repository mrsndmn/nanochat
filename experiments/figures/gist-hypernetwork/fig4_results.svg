text-anchor="middle" >0.58</text><text x="1195.0" y="418" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle" >b20</text><line x1="910" y1="400" x2="1224" y2="400" stroke="#c3c2b7" stroke-width="1.5" /><text x="910" y="452" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >Adding memory to the shared KV stream made</text><text x="910" y="470" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >the model TURN DOWN the whole channel</text><text x="910" y="488" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >(α: 1.15 → 0.42–0.58) — even though every</text><text x="910" y="506" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >table was written at full breadth (100% of</text><text x="910" y="524" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >rows, norms ≈ wte scale). Used, but harmful:</text><text x="910" y="542" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >collision noise displaced the content signal.</text><line x1="28" y1="590" x2="1212" y2="590" stroke="#e1e0d9" stroke-width="1" /><text x="28" y="618" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Takeaway</text><text x="28" y="642" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >Neither recomputed content (it.1) nor stored n-gram memory (it.2) improves the strict regime through the gist INPUT channel — content was consumed at full gate</text><text x="28" y="661" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >strength yet bought −0.0008 BPB; memory was written at full breadth yet cost +0.0005…+0.0014. The 0.017 gap to full causal lives in channel bandwidth /</text><text x="28" y="680" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >block-causality itself, not in what gist inputs carry. Deferred TTT-on-gist-inputs is deprioritized by the same evidence.</text></svg>