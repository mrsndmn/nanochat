<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="730" viewBox="0 0 1960 730" font-family="DejaVu Sans, system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="1960" height="730" fill="#fcfcfb"/><text x="28" y="40" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Results — the gist-input channel is double-falsified</text><text x="28" y="64" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start" >Iteration 1: content is used but redundant. Iteration 2: memory is used but harmful. The win gate was never approached.</text><text x="300" y="104" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >val BPB (primary, lower is better)</text><line x1="300.0" y1="122" x2="300.0" y2="454" stroke="#e1e0d9" stroke-width="1" /><text x="300.0" y="472" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >0.800</text><line x1="390.47619047619094" y1="122" x2="390.47619047619094" y2="454" stroke="#e1e0d9" stroke-width="1" /><text x="390.47619047619094" y="472" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >0.805</text><line x1="480.9523809523819" y1="122" x2="480.9523809523819" y2="454" stroke="#e1e0d9" stroke-width="1" /><text x="480.9523809523819" y="472" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >0.810</text><line x1="571.4285714285709" y1="122" x2="571.4285714285709" y2="454" stroke="#e1e0d9" stroke-width="1" /><text x="571.4285714285709" y="472" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >0.815</text><line x1="661.9047619047618" y1="122" x2="661.9047619047618" y2="454" stroke="#e1e0d9" stroke-width="1" /><text x="661.9047619047618" y="472" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >0.820</text><line x1="591.3333333333346" y1="122" x2="591.3333333333346" y2="454" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5,4"/><text x="591.3333333333346" y="114" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="middle" >win gate 0.8161</text><text x="288" y="154" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="end" >full-causal baseline</text><line x1="300" y1="150" x2="339.9904761904752" y2="150" stroke="#e1e0d9" stroke-width="1" /><circle cx="339.9904761904752" cy="150" r="7" fill="#898781" stroke="#fcfcfb" stroke-width="2"/><text x="352.9904761904752" y="154" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.80221</text><text x="288" y="194" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="end" >fixed-gist control (K=8)</text><line x1="300" y1="190" x2="644.8952380952389" y2="190" stroke="#e1e0d9" stroke-width="1" /><circle cx="644.8952380952389" cy="190" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="657.8952380952389" y="194" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.81906</text><text x="288" y="234" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="end" >hypernet gated  (it.1)</text><line x1="300" y1="230" x2="630.419047619048" y2="230" stroke="#e1e0d9" stroke-width="1" /><circle cx="630.419047619048" cy="230" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="643.419047619048" y="234" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.81826</text><text x="288" y="274" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="end" >hypernet forced  (it.1)</text><line x1="300" y1="270" x2="637.1142857142859" y2="270" stroke="#e1e0d9" stroke-width="1" /><circle cx="637.1142857142859" cy="270" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="650.1142857142859" y="274" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.81863</text><text x="288" y="314" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="end" >+ engram 2¹⁷  (it.2)</text><line x1="300" y1="310" x2="647.2476190476193" y2="310" stroke="#e1e0d9" stroke-width="1" /><circle cx="647.2476190476193" cy="310" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="660.2476190476193" y="314" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.81919</text><text x="288" y="354" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="end" >+ engram 2¹⁸  (it.2)</text><line x1="300" y1="350" x2="652.4952380952386" y2="350" stroke="#e1e0d9" stroke-width="1" /><circle cx="652.4952380952386" cy="350" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="665.4952380952386" y="354" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.81948</text><text x="288" y="394" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="end" >+ engram 2¹⁹  (it.2)</text><line x1="300" y1="390" x2="656.1142857142859" y2="390" stroke="#e1e0d9" stroke-width="1" /><circle cx="656.1142857142859" cy="390" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="669.1142857142859" y="394" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.81968</text><text x="288" y="434" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="end" >+ engram 2²⁰  (it.2)</text><line x1="300" y1="430" x2="640.0095238095248" y2="430" stroke="#e1e0d9" stroke-width="1" /><circle cx="640.0095238095248" cy="430" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="653.0095238095248" y="434" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.81879</text><text x="800" y="104" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >CORE (higher is better; reference-only)</text><line x1="800.0" y1="122" x2="800.0" y2="454" stroke="#e1e0d9" stroke-width="1" /><text x="800.0" y="472" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >0.10</text><line x1="862.2222222222222" y1="122" x2="862.2222222222222" y2="454" stroke="#e1e0d9" stroke-width="1" /><text x="862.2222222222222" y="472" font-size="11" f