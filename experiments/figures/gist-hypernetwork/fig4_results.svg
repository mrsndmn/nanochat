2" cy="270" r="7" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="964.8222222222222" y="274" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.1488</text><line x1="800" y1="310" x2="917.2888888888888" y2="310" stroke="#e1e0d9" stroke-width="1" /><line x1="913.5555555555555" y1="310" x2="921.0222222222222" y2="310" stroke="#52514e" stroke-width="2" /><circle cx="917.2888888888888" cy="310" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="930.2888888888888" y="314" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.1377</text><line x1="800" y1="350" x2="850.7733333333333" y2="350" stroke="#e1e0d9" stroke-width="1" /><line x1="846.4177777777778" y1="350" x2="855.1288888888889" y2="350" stroke="#52514e" stroke-width="2" /><circle cx="850.7733333333333" cy="350" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="863.7733333333333" y="354" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.1163</text><line x1="800" y1="390" x2="881.8533333333334" y2="390" stroke="#e1e0d9" stroke-width="1" /><line x1="875.6311111111111" y1="390" x2="888.0755555555555" y2="390" stroke="#52514e" stroke-width="2" /><circle cx="881.8533333333334" cy="390" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="894.8533333333334" y="394" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.1263</text><line x1="800" y1="430" x2="935.3955555555556" y2="430" stroke="#e1e0d9" stroke-width="1" /><line x1="930.4177777777778" y1="430" x2="940.3733333333333" y2="430" stroke="#52514e" stroke-width="2" /><circle cx="935.3955555555556" cy="430" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="948.3955555555556" y="434" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >0.1435</text><text x="800" y="526" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start" >whiskers: ± s.d. over the 5 eval seeds (where evaluated with the</text><text x="800" y="540" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start" >seeded protocol). Training-seed noise on CORE is ~±0.01.</text><rect x="300" y="491" width="12" height="12" fill="#898781" rx="3" opacity="1.0" stroke="none" stroke-width="0"/><text x="318" y="501" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >reference</text><rect x="405" y="491" width="12" height="12" fill="#eb6834" rx="3" opacity="1.0" stroke="none" stroke-width="0"/><text x="423" y="501" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >fixed gists</text><rect x="515" y="491" width="12" height="12" fill="#2a78d6" rx="3" opacity="1.0" stroke="none" stroke-width="0"/><text x="533" y="501" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >it.1 content hypernet</text><rect x="690" y="491" width="12" height="12" fill="#1baf7a" rx="3" opacity="1.0" stroke="none" stroke-width="0"/><text x="708" y="501" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >it.2 + engram memory</text><text x="1170" y="104" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >gate readout: mean |α| per arm</text><line x1="1175" y1="400.0" x2="1471" y2="400.0" stroke="#e1e0d9" stroke-width="1" /><text x="1169" y="404.0" font-size="11" fill="#898781" font-weight="normal" text-anchor="end" >0.0</text><line x1="1175" y1="296.1538461538462" x2="1471" y2="296.1538461538462" stroke="#e1e0d9" stroke-width="1" /><text x="1169" y="300.1538461538462" font-size="11" fill="#898781" font-weight="normal" text-anchor="end" >0.5</text><line x1="1175" y1="192.30769230769232" x2="1471" y2="192.30769230769232" stroke="#e1e0d9" stroke-width="1" /><text x="1169" y="196.30769230769232" font-size="11" fill="#898781" font-weight="normal" text-anchor="end" >1.0</text><rect x="1215" y="161.98461538461544" width="40" height="238.01538461538456" fill="#2a78d6" rx="4" opacity="1.0" stroke="none" stroke-width="0"/><rect x="1215" y="398" width="40" height="2" fill="#fcfcfb" rx="0" opacity="1.0" stroke="none" stroke-width="0"/><text x="1235.0" y="153.98461538461544" font-size="11.5" fill="#0b0b0b" font-weight="bold" text-anchor="middle" >1.15</text><text x="1235.0" y="418" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle" >gated</text><rect x="1267" y="311.9384615384615" width="40" height="88.06153846153848" fill="#1baf7a" rx="4" opacity="1.0" stroke="none" stroke-width="0"/><rect x="1267" y="398" width="40" height="2" fill="#fcfcfb" rx="0" opacity="1.0" stroke="none" stroke-width="0"/><text x="1287.0" y="303.9384615384615" font-size="11.5" fill="#0b0b0b" font-weight="bold" text-anchor="middle" >0.42</text><text x="1287.0" y="418" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle" >b17</text><rect x="1319" y="294.2846153846154" width="40" height="105.71538461538461" fill="#1baf7a" rx="4" opacity="1.0" stroke="none" stroke-width="0"/><rect x="1319" y="398" width="40" height="2" fill="#fcfcfb" rx="0" opacity="1.0" stroke="none" stroke-width="0"/><text x="1339.0" y="286.2846153846154" font-size="11.5" fill="#0b0b0b" font-weight="bold" text-anchor="middle" >0.51</text><text x="1339.0" y="418" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle" >b18</text><rect x="1371" y="290.75384615384615" width="40" height="109.24615384615385" fill="#1baf7a" rx="4" opacity="1.0" stroke="none" stroke-width="0"/><rect x="1371" y="398" width="40" height="2" fill="#fcfcfb" rx="0" opacity="1.0" stroke="none" stroke-width="0"/><text x="1391.0" y="282.75384615384615" font-size="11.5" fill="#0b0b0b" font-weight="bold" text-anchor="middle" >0.53</text><text x="1391.0" y="418" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle" >b19</text><rect x="1423" y="279.33076923076925" width="40" height="120.66923076923075" fill="#1baf7a" rx="4" opacity="1.0" stroke="none" stroke-width="0"/><rect x="1423" y="398" width="40" height="2" fill="#fcfcfb" rx="0" opacity="1.0" stroke="none" stroke-width="0"/><text x="1443.0" y="271.33076923076925" font-size="11.5" fill="#0b0b0b" font-weight="bold" text-anchor="middle" >0.58</text><text x="1443.0" y="418" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle" >b20</text><line x1="1175" y1="400" x2="1471" y2="400" stroke="#c3c2b7" stroke-width="1.5" /><text x="1170" y="448" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >Adding memory to the shared KV stream</text><text x="1170" y="466" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >made the model TURN DOWN the whole</text><text x="1170" y="484" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >channel (α: 1.15 → 0.42–0.58), despite</text><text x="1170" y="502" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >every table being written at full breadth</text><text x="1170" y="520" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >(100% of rows, norms ≈ wte scale).</text><text x="1170" y="538" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >Used, but harmful: collision noise</text><text x="1170" y="556" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >displaced the content signal.</text><text x="1568" y="104" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >attention tokens per query (K=8, val rows)</text><line x1="1580.0" y1="130" x2="1580.0" y2="420" stroke="#e1e0d9" stroke-width="1" /><text x="1580.0" y="436" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >0</text><line x1="1652.7272727272727" y1="130" x2="1652.7272727272727" y2="420" stroke="#e1e0d9" stroke-width="1" /><text x="1652.7272727272727" y="436" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >250</text><line x1="1725.4545454545455" y1="130" x2="1725.4545454545455" y2="420" stroke="#e1e0d9" stroke-width="1" /><text x="1725.4545454545455" y="436" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >500</text><line x1="1798.1818181818182" y1="130" x2="1798.1818181818182" y2="420" stroke="#e1e0d9" stroke-width="1" /><text x="1798.1818181818182" y="436" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >750</text><line x1="1870.909090909091" y1="130" x2="1870.909090909091" y2="420" stroke="#e1e0d9" stroke-width="1" /><text x="1870.909090909091" y="436" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle" >1000</text><text x="1568" y="214" font-size="12" fill="#52514e" font-weight="normal" text-anchor="end" >full causal (baseline)</text><rect x="1580" y="201" width="298.0363636363636" height="18" fill="#c3c2b7" rx="4" opacity="1.0" stroke="none" stroke-width="0"/><text x="1888.0363636363636" y="214" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >1,024</text><text x="1568" y="284" font-size="12" fill="#52514e" font-weight="normal" text-anchor="end" >full causal within doc</text><rect x="1580" y="271" width="172.53818181818178" height="18" fill="#e1e0d9" rx="4" opacity="1.0" stroke="none" stroke-width="0"/><text x="1762.5381818181818" y="284" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >593</text><text x="1568" y="354" font-size="12" fill="#52514e" font-weight="normal" text-anchor="end" >sentence attention (K=8)</text><rect x="1580" y="341" width="49.27999999999997" height="18" fill="#eb6834" rx="4" opacity="1.0" stroke="none" stroke-width="0"/><text x="1639.28" y="354" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start" >169</text><text x="1639.28" y="326" font-size="15" fill="#eb6834" font-weight="bold" text-anchor="start" >−83.5%</text><text x="1568" y="470" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" >83.5% fewer attended keys per query than the full-causal baseline</text><text x="1568" y="487" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" >(169 vs 1024; −71.4% even against a same-doc causal reference).</text><text x="1568" y="504" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" >Attention pairs ≈ prefill FLOPs and KV cache — both scale 1:1 with them.</text><text x="1568" y="521" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" >Cost: inserted gist tokens occupy 25% of sequence capacity (40% at</text><text x="1568" y="538" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" >K=16, where the saving falls to 72.4%).</text><line x1="28" y1="600" x2="1932" y2="600" stroke="#e1e0d9" stroke-width="1" /><text x="28" y="628" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Takeaway</text><text x="28" y="652" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >Neither recomputed content (it.1) nor stored n-gram memory (it.2) improves the strict regime through the gist INPUT channel — content was consumed at full gate strength</text><text x="28" y="671" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >yet bought −0.0008 BPB; memory was written at full breadth yet cost +0.0005…+0.0014. CORE agrees: no arm recovers the strict regime's CORE cost (0.183 → 0.14x) and the</text><text x="28" y="690" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >engram arms trend lower still. The 0.017 BPB gap to full causal lives in channel bandwidth / block-causality itself; deferred TTT-on-gist-inputs is deprioritized by the same evidence.</text><text x="28" y="709" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >Efficiency survives: the strict mask attends 169 vs 1024 keys per query (K=8, val rows) — 83.5% fewer attention tokens / prefill FLOPs — at the cost of gists filling 25% of sequence capacity.</text></svg>