<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="DejaVu Sans, system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="1240" height="680" fill="#fcfcfb"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/></marker></defs><text x="28" y="40" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Iteration 2 — Engram-style sparse bigram memory in the hypernetwork</text><text x="28" y="64" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start" >Iteration 1 verdict: context-derived content is redundant. This injects the one thing the trunk cannot compute from context — stored n-gram associations.</text><rect x="28" y="110" width="250" height="92" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="28" y="110" width="4" height="92" fill="#52514e" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="42" y="134" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start" >bigram stream</text><text x="42" y="154" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >every sentence position j:</text><text x="42" y="171" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >(t₍ⱼ₋₁₎ , tⱼ)  — surface form,</text><text x="42" y="188" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >no learned computation</text><rect x="322" y="110" width="300" height="92" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="322" y="110" width="4" height="92" fill="#1baf7a" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="336" y="134" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start" >hash (engram-lite recipe)</text><text x="336" y="154" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >(36313·cur ⊕ 27191·prev) mod 2ᵇ</text><text x="336" y="171" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >kept eager via compiler.disable</text><text x="336" y="188" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >(known Inductor int32 gather trap)</text><line x1="278" y1="156" x2="322" y2="156" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><text x="668" y="92" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="start" >memory table  2ᵇ × 128, ZERO-init</text><rect x="668" y="102" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><rect x="668" y="112" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><rect x="668" y="122" width="150" height="8" fill="#1baf7a" rx="2" opacity="0.95" stroke="none" stroke-width="0"/><rect x="668" y="132" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><rect x="668" y="142" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><rect x="668" y="152" width="150" height="8" fill="#1baf7a" rx="2" opacity="0.95" stroke="none" stroke-width="0"/><rect x="668" y="162" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><rect x="668" y="172" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><rect x="668" y="182" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><rect x="668" y="192" width="150" height="8" fill="#1baf7a" rx="2" opacity="0.95" stroke="none" stroke-width="0"/><rect x="668" y="202" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><rect x="668" y="212" width="150" height="8" fill="#e1e0d9" rx="2" opacity="0.8" stroke="none" stroke-width="0"/><text x="668" y="244" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" >O(1) sparse lookups — few rows touched</text><text x="668" y="260" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" >per example; params ≫ compute</text><text x="668" y="276" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" >(the Engram thesis)</text><line x1="622" y1="156" x2="668" y2="156" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><rect x="940" y="110" width="272" height="92" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="940" y="110" width="4" height="92" fill="#2a78d6" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="954" y="134" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start" >into the SAME cross-attn</text><text x="954" y="154" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >proj 128→768 (nonzero init)</text><text x="954" y="171" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >added to the RMSNormed KV input;</text><text x="954" y="188" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >slot queries select memories</text><line x1="826" y1="156" x2="940" y2="156" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><text x="28" y="320" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Safety of the composition</text><text x="28" y="346" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >zero-init table  →  each arm starts bit-exact equal to the plain gated arm (test-enforced)</text><text x="28" y="366" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >not a dead path: α gates open first (measured |α|≈1.15 in iteration 1), then gradients reach the table through the nonzero projection</text><text x="28" y="386" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >own-sentence mask keeps retrieval sentence-local; table sits in the AdamW embedding group, excluded from the scaling-params horizon</text><text x="28" y="440" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Capacity sweep — 4 arms on top of GATED (win gate unchanged: val BPB ≤ 0.8161)</text><rect x="28" y="456" width="280" height="74" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="28" y="456" width="4" height="74" fill="#1baf7a" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="42" y="480" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="start" >eng_b17</text><text x="42" y="500" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >2¹⁷ × 128</text><text x="42" y="518" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >≈ 17M table params</text><rect x="328" y="456" width="280" height="74" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="328" y="456" width="4" height="74" fill="#1baf7a" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="342" y="480" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="start" >eng_b18</text><text x="342" y="500" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >2¹⁸ × 128</text><text x="342" y="518" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >≈ 34M</text><rect x="628" y="456" width="280" height="74" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="628" y="456" width="4" height="74" fill="#1baf7a" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="642" y="480" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="start" >eng_b19</text><text x="642" y="500" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >2¹⁹ × 128</text><text x="642" y="518" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >≈ 67M</text><rect x="928" y="456" width="280" height="74" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="928" y="456" width="4" height="74" fill="#1baf7a" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="942" y="480" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="start" >eng_b20</text><text x="942" y="500" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >2²⁰ × 128</text><text x="942" y="518" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >≈ 134M</text><text x="28" y="570" font-size="12" fill="#898781" font-weight="normal" text-anchor="start" >Prior support: token-level engram-lite was this repo's best low-dim result (0.7937 vs 0.8027 baseline, monotone in table size) — dev/LOG 2026-01-27.</text></svg>