<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="DejaVu Sans, system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="1240" height="640" fill="#fcfcfb"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/></marker></defs><text x="28" y="40" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Iteration 1 — Gist Hypernetwork: content-conditioned gist embeddings</text><text x="28" y="64" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start" >One masked cross-attention pass replaces the content-blind fixed gist rows. Everything else — trunk, mask, dataloader, schedule — identical to the control.</text><text x="28" y="110" font-size="12" fill="#2a78d6" font-weight="bold" text-anchor="start" >completed sentence</text><text x="475" y="110" font-size="12" fill="#eb6834" font-weight="bold" text-anchor="start" >its K=8 gist slots</text><rect x="28" y="120" width="54" height="30" fill="#2a78d6" rx="5" opacity="0.9" stroke="none" stroke-width="0"/><text x="55" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >t1</text><rect x="88" y="120" width="54" height="30" fill="#2a78d6" rx="5" opacity="0.9" stroke="none" stroke-width="0"/><text x="115" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >t2</text><rect x="148" y="120" width="54" height="30" fill="#2a78d6" rx="5" opacity="0.9" stroke="none" stroke-width="0"/><text x="175" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >t3</text><rect x="208" y="120" width="54" height="30" fill="#2a78d6" rx="5" opacity="0.9" stroke="none" stroke-width="0"/><text x="235" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >t4</text><rect x="268" y="120" width="54" height="30" fill="#2a78d6" rx="5" opacity="0.9" stroke="none" stroke-width="0"/><text x="295" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >t5</text><rect x="328" y="120" width="54" height="30" fill="#2a78d6" rx="5" opacity="0.9" stroke="none" stroke-width="0"/><text x="355" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >t6</text><rect x="388" y="120" width="54" height="30" fill="#2a78d6" rx="5" opacity="0.9" stroke="none" stroke-width="0"/><text x="415" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >t7</text><rect x="460" y="120" width="38" height="30" fill="#eb6834" rx="5" opacity="1.0" stroke="none" stroke-width="0"/><text x="479" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >g1</text><rect x="504" y="120" width="38" height="30" fill="#eb6834" rx="5" opacity="1.0" stroke="none" stroke-width="0"/><text x="523" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >g2</text><rect x="548" y="120" width="38" height="30" fill="#eb6834" rx="5" opacity="1.0" stroke="none" stroke-width="0"/><text x="567" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >g3</text><rect x="592" y="120" width="38" height="30" fill="#eb6834" rx="5" opacity="1.0" stroke="none" stroke-width="0"/><text x="611" y="140" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" >g4</text><text x="645" y="140" font-size="13" fill="#eb6834" font-weight="bold" text-anchor="start" >…g8</text><rect x="28" y="190" width="300" height="96" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="28" y="190" width="4" height="96" fill="#2a78d6" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="42" y="214" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start" >keys / values</text><text x="42" y="234" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >shared wte embeddings of the</text><text x="42" y="251" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >sentence tokens → RMSNorm</text><text x="42" y="268" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >(gradients flow back into wte)</text><rect x="28" y="306" width="300" height="96" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="28" y="306" width="4" height="96" fill="#eb6834" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="42" y="330" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start" >queries</text><text x="42" y="350" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >K=8 learned per-slot vectors,</text><text x="42" y="367" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >directly in projected-Q space</text><text x="42" y="384" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >(slot k = gist id − gist_start)</text><rect x="392" y="234" width="330" height="130" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="392" y="234" width="4" height="130" fill="#2a78d6" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="406" y="258" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start" >masked cross-attention</text><text x="406" y="278" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >own-sentence mask (cummax boundary</text><text x="406" y="295" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >machinery; no gathers — compile-safe),</text><text x="406" y="312" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >rotary + QK-norm as in the trunk,</text><text x="406" y="329" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >c_proj output → h₁ … h₈  (content)</text><line x1="328" y1="238" x2="392" y2="270" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><line x1="328" y1="354" x2="392" y2="330" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><line x1="722" y1="300" x2="790" y2="300" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr)"/><rect x="790" y="190" width="420" height="100" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="790" y="190" width="4" height="100" fill="#2a78d6" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="804" y="214" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start" >GATED arm   d12_sa_nltk_k8_hnet_gated</text><text x="804" y="234" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >gist embedding = wte[gₖ] + αₖ · hₖ,  per-slot αₖ = 0 at init</text><text x="804" y="251" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >→ bit-exact equal to the fixed-gist control at step 0</text><text x="804" y="268" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >→ final |α| is a free mechanistic readout (did it engage?)</text><rect x="790" y="310" width="420" height="84" fill="#ffffff" rx="8" opacity="1.0" stroke="#e1e0d9" stroke-width="1.5"/><rect x="790" y="310" width="4" height="84" fill="#2a78d6" rx="2" opacity="1.0" stroke="none" stroke-width="0"/><text x="804" y="334" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start" >FORCED arm   d12_sa_nltk_k8_hnet_forced</text><text x="804" y="354" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >gist embedding = hₖ outright — no fixed row, no gate</text><text x="804" y="371" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" >→ the model MUST live off content (falsification arm)</text><line x1="28" y1="440" x2="1212" y2="440" stroke="#e1e0d9" stroke-width="1" /><text x="28" y="470" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Why two arms (ADR 0002)</text><text x="28" y="494" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >gated ≈ control with α≈0  →  channel unused (honest null)</text><text x="28" y="514" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >forced &lt; control while gated ≈ control  →  content harmful/useless — direction falsified</text><text x="28" y="534" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >either arm ≤ 0.8161  →  content-conditioning wins</text><text x="660" y="470" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start" >Budget &amp; bookkeeping</text><text x="660" y="494" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >+1.8M params (~1%) — projections in Muon, queries/gates in AdamW</text><text x="660" y="514" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >hypernet excluded from the scaling-params horizon → schedule identical to control</text><text x="660" y="534" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start" >c_proj deliberately NOT zero-init: zero gate × zero proj = dead path (known bug class)</text></svg>